<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Аренда жилья — Дананг и др.</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="filtersToggle" aria-label="Фильтры">☰ Фильтры</button>
      <span id="resultCount"></span>
    </header>

    <aside id="filtersPanel">
      <h2>Фильтры</h2>

      <label>Город
        <select id="f-city">
          <option value="">Любой</option>
          <option value="da_nang">Дананг</option>
          <option value="nha_trang">Нячанг</option>
          <option value="ho_chi_minh">Хошимин</option>
          <option value="hanoi">Ханой</option>
          <option value="hoi_an">Хойан</option>
        </select>
      </label>

      <label>Бюджет в месяц, $
        <div class="range-row">
          <input type="number" id="f-price-min" placeholder="от" min="0" />
          <input type="number" id="f-price-max" placeholder="до" min="0" />
        </div>
      </label>

      <label>Комнаты
        <select id="f-rooms">
          <option value="">Любое</option>
          <option value="studio">Студия</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4+</option>
        </select>
      </label>

      <label>Тип жилья
        <select id="f-type">
          <option value="">Любое</option>
          <option value="apartment">Квартира</option>
          <option value="room">Комната</option>
          <option value="house">Дом</option>
          <option value="villa">Вилла</option>
        </select>
      </label>

      <label>Качество ремонта
        <select id="f-renovation">
          <option value="">Любое</option>
          <option value="needs_repair">Требует ремонта</option>
          <option value="standard">Стандартный</option>
          <option value="good">Хороший</option>
          <option value="premium">Премиум</option>
        </select>
      </label>

      <label>Питомцы
        <select id="f-pets">
          <option value="">Неважно</option>
          <option value="allowed">Можно</option>
          <option value="not_allowed">Нельзя</option>
        </select>
      </label>

      <button id="applyFilters">Показать</button>
      <button id="resetFilters" class="secondary">Сбросить</button>
    </aside>

    <main id="map"></main>

    <div id="listingModal" class="modal hidden">
      <div class="modal-content">
        <button id="closeModal" class="close-btn" aria-label="Закрыть">✕</button>
        <div id="gallery"></div>
        <div id="listingDetails"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
