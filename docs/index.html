<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Аренда жилья во Вьетнаме</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="filtersToggle" class="tb-btn">
        <span class="tb-icon">☰</span><span data-i18n="filters">Фильтры</span>
        <span id="activeFilterCount" class="badge hidden">0</span>
      </button>

      <div id="viewToggle" class="segmented">
        <button data-view="map" class="active" data-i18n="map">Карта</button>
        <button data-view="list" data-i18n="list">Список</button>
      </div>

      <button id="langToggle" class="tb-btn lang-btn" aria-label="Language">🌐&nbsp;<span id="langCode">RU</span></button>
    </header>

    <div id="tabBar">
      <button data-tab="all" class="active" data-i18n="tab_all">Все</button>
      <button data-tab="saved" data-i18n="tab_saved">Избранное</button>
      <button data-tab="viewed" data-i18n="tab_viewed">Просмотренные</button>
    </div>

    <div id="resultBar">
      <span id="resultCount"></span>
      <select id="sortSelect" aria-label="Sort"></select>
    </div>

    <main id="mapWrap"><div id="map"></div></main>
    <section id="listView" class="hidden"></section>

    <!-- filters -->
    <div id="filtersScrim" class="scrim hidden"></div>
    <aside id="filtersPanel">
      <div class="panel-head">
        <h2 data-i18n="filters">Фильтры</h2>
        <button id="filtersClose" class="close-btn" aria-label="×">✕</button>
      </div>

      <div class="panel-body">
        <div class="field">
          <label data-i18n="city">Город</label>
          <div class="chips" id="f-city" data-multi="true"></div>
        </div>

        <div class="field">
          <label data-i18n="budget">Бюджет в месяц, $</label>
          <div class="range-row">
            <input type="number" id="f-price-min" min="0" step="50" data-i18n-ph="from" placeholder="от" />
            <span class="dash">—</span>
            <input type="number" id="f-price-max" min="0" step="50" data-i18n-ph="to" placeholder="до" />
          </div>
        </div>

        <div class="field">
          <label data-i18n="rooms">Комнаты</label>
          <div class="chips" id="f-rooms" data-multi="true"></div>
        </div>

        <div class="field">
          <label data-i18n="property_type">Тип жилья</label>
          <div class="chips" id="f-type" data-multi="true"></div>
        </div>

        <div class="field">
          <label data-i18n="renovation">Качество ремонта</label>
          <div class="chips" id="f-renovation" data-multi="true"></div>
        </div>

        <div class="field">
          <label data-i18n="pets">Питомцы</label>
          <div class="chips" id="f-pets" data-multi="false"></div>
        </div>
      </div>

      <div class="panel-foot">
        <button id="resetFilters" class="btn-secondary" data-i18n="reset">Сбросить</button>
        <button id="applyFilters" class="btn-primary" data-i18n="show">Показать</button>
      </div>
    </aside>

    <!-- language sheet -->
    <div id="langScrim" class="scrim hidden"></div>
    <div id="langSheet" class="sheet">
      <div class="panel-head">
        <h2 data-i18n="language">Язык</h2>
        <button id="langClose" class="close-btn" aria-label="×">✕</button>
      </div>
      <div class="lang-list" id="langList"></div>
    </div>

    <!-- listing detail -->
    <div id="listingModal" class="modal hidden">
      <div class="modal-content">
        <button id="closeModal" class="close-btn floating" aria-label="×">✕</button>
        <div id="gallery" class="gallery"></div>
        <div id="galleryDots" class="dots"></div>
        <div id="listingDetails" class="details"></div>
      </div>
    </div>

    <!-- fullscreen photo viewer -->
    <div id="lightbox" class="lightbox hidden">
      <button id="lightboxClose" class="lb-btn lb-close" aria-label="×">✕</button>
      <button id="lightboxPrev" class="lb-btn lb-prev" aria-label="‹">‹</button>
      <img id="lightboxImg" alt="" />
      <button id="lightboxNext" class="lb-btn lb-next" aria-label="›">›</button>
      <div id="lightboxCount" class="lb-count"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    // Where the Flask API lives. Set here rather than in app.js so pointing the
    // Mini App at a different backend is a one-line change in one file.
    window.API_BASE_URL = "https://svetlanamendez93.pythonanywhere.com";
  </script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
