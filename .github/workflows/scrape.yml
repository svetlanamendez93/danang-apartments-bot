name: Scrape Telegram channels

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      backfill_pages:
        description: "Pages of channel history to backfill (0 = normal run, just the newest page)"
        required: false
        default: "0"

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dotenv

      - name: Run scraper
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          SOURCE_CHANNELS: ${{ vars.SOURCE_CHANNELS }}
          BACKFILL_PAGES: ${{ github.event.inputs.backfill_pages || '0' }}
        run: |
          if [ "$BACKFILL_PAGES" -gt 0 ]; then
            python scraper/scrape_telegram.py --backfill "$BACKFILL_PAGES"
          else
            python scraper/scrape_telegram.py
          fi
